
[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font Propo"

[window]
opacity = 0.9

[window.padding]
x = 8
y = 8

[selection]
save_to_clipboard = true

[general]
import = [
    "~/.cache/wal/colors-alacritty.toml"
]

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Shift | Super"

# vi: ft=config
source = ~/.cache/wal/colors-hyprland.conf
source = ~/.config/hypr/hyprenv.conf
$wallpaper_image=/home/pateraki/ownCloud/Wallpapers/iliana_window.png

monitor=,preferred,auto,1

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,gr
    kb_variant = ,simple
    #kb_model =
    kb_options = grp:win_space_toggle
    #kb_rules =
    follow_mouse = 2
    # mouse_refocus = false
    float_switch_override_focus = 0
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    numlock_by_default = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    # col.active_border = 0xff$color4 0xff$color8 45deg
    col.active_border = 0xff$color4
    col.inactive_border = 0xcc$color0
    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 6
    
    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a1a77)
        offset = 0 4
    }

    dim_special = 0.8
}

animations {
    enabled = yes
    animation = windows, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = border, 1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default, fade
    animation = specialWorkspace, 1, 5, default, slidefadevert -20%
}

group {
    col.border_active = 0xff$color10 0xff$color12 45deg
    col.border_inactive = 0xbb$background
    col.border_locked_active = 0xff$color10
    col.border_locked_inactive = 0xbb$background
    groupbar {
        font_family = Aptos
        font_size = 11
        height = 20
        gradients = true
        text_color = 0xff000000
        col.active = 0xff$color10
        col.inactive = 0xbb$color8
    }
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    allow_small_split = yes
    mfact = 0.6
    special_scale_factor = 0.95
    orientation = top
}

misc {
    animate_manual_resizes = yes
    new_window_takes_over_fullscreen = 2
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic-mouse-v1 {
#    sensitivity = -0.5
#}

binds {
    workspace_center_on = 1
}

plugin {
    # hyprbars {
    #     bar_height = 24
    #     bar_color = rgb($color0)
    #     col.text = rgb($color7)
    #     bar_text_font = Source Sans Medium
    #     bar_text_size = 10
    #     bar_text_align = left
    #     bar_part_of_window = true
    #     bar_precedence_over_border = true
    #     # bar_title_enabled = false
    #
    #     hyprbars-button = rgb($color0), 18, 󰖭, hyprctl dispatch killactive
    #     hyprbars-button = rgb($color0), 18, 󰖯, hyprctl dispatch fullscreen 1
    #     hyprbars-button = rgb($color0), 18, 󰐃, hyprctl dispatch pin
    # }
    hyprexpo {
        # columns = 2
        # gap_size = 4
        # bg_col = 0x99$color0
        # workspace_method = first m~1 # [center/first] [workspace] e.g. first 1 or center m+1
        #
        # enable_gesture = true # laptop touchpad
        # gesture_fingers = 3  # 3 or 4
        # gesture_distance = 300 # how far is the "max"
        # gesture_positive = true # positive = swipe down. Negative = swipe up.
    }
}
# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# float all windows
windowrulev2 = float,class:.+
# windowrulev2 = size 60% 60%,class:.+
# windowrulev2 = center,class:.+
# except terminals (alacritty), vscode, firefox, Microsoft-edge, nvim-qt, neovide

# tile by application
windowrulev2 = tile,class:^(firefox)$
windowrulev2 = tile,class:^(Alacritty)$
windowrulev2 = tile,class:^(Code)$
windowrulev2 = tile,class:^(neovide)$
# windowrulev2 = tile,class:^(thunderbird)
# windowrulev2 = tile,title:^(Outlook)
# windowrulev2 = tile,title:^(Microsoft Teams)

# windowrulev2 = workspace 1,class:^(firefox)$
# windowrulev2 = workspace 2,class:^(Alacritty)$
# windowrulev2 = workspace 2,class:^(Code)$
# windowrulev2 = workspace 2,class:^(neovide)$
# windowrulev2 = workspace 2,class:^(nvim-qt)$
# windowrulev2 = workspace 3,class:^(thunderbird)
# windowrulev2 = workspace 3,title:^(Outlook)
# windowrulev2 = workspace 4,title:^(Microsoft Teams)
# windowrulev2 = workspace 10,class:^(Spotify)$

# float and fullscreen util-term
# windowrulev2 = float,class:^util-term$
windowrulev2 = fullscreen,class:^overlay-term$
windowrulev2 = noborder,class:^overlay-term$
windowrulev2 = animation fade,class:^overlay-term$
windowrulev2 = nodim,class:^overlay-term$
windowrulev2 = noshadow,class:^overlay-term$

windowrulev2 = plugin:hyprbars:nobar,floating:0
windowrulev2 = noshadow,floating:0

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# launchers
bind = $mainMod, Return, exec, alacritty

# generic app launcher
# bind = $mainMod, slash, exec, wofi --show drun
# bind = $mainMod, slash, exec, anyrun
bind = $mainMod, slash, exec, tofi-drun --drun-launch=true

# bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/openfile.sh
# bind = $mainMod SHIFT, slash, exec, alacritty --class=util-term --option font.size=24 -e /usr/bin/bash -c ~/.config/hypr/scripts/switchwindow.sh

# window management
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating, 
bind = $mainMod, G, togglegroup, 
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, Tab, changegroupactive
bind = $mainMod, O, exec, /home/pateraki/.local/bin/overlaytui.sh /bin/zsh

# manage master layout
bind = $mainMod CTRL, M, exec, /home/pateraki/.config/hypr/scripts/togglelayout.sh
bind = $mainMod SHIFT, M, layoutmsg, orientationcycle left top
bind = $mainMod, M, layoutmsg, swapwithmaster master

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# session management and misc
bind = $mainMod SHIFT, F12, exec, wlogout
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, L, exec, hyprlock

# Screen brightness
# bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
# bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness=raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness=lower
# 
# Volume
# bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
# bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
# bind = , XF86AudioMicMute, exec, pamixer --default-source -m
# bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume=raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume=lower
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume=mute-toggle
bind = , XF86AudioMute, exec, swayosd-client --output-volume=mute-toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# same, but with vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, tab, cyclenext, floating
bind = $mainMod, tab, bringactivetotop

# Move window with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# stash window management
bind = $mainMod SHIFT, Backspace, movetoworkspacesilent, special
bind = $mainMod, Backspace, togglespecialworkspace

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move to workspace with mainMod + PgUp/PgDown
bind = $mainMod, page_down, workspace, r+1
bind = $mainMod, page_up, workspace, r-1
bind = $mainMod, mouse_right, workspace, r+1
bind = $mainMod, mouse_left, workspace, r-1
bind = $mainMod, W, exec, /home/pateraki/.config/hypr/scripts/movewstomonitor.sh

# move to workspace with mainMod + PgUp/PgDown
bind = $mainMod SHIFT, page_down, movetoworkspace, r+1
bind = $mainMod SHIFT, page_up, movetoworkspace, r-1
bind = $mainMod SHIFT, mouse_right, movetoworkspace, r+1
bind = $mainMod SHIFT, mouse_left, movetoworkspace, r-1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# lid switch
# bindl=,switch:on:Lid Switch,exec,hyprctl keyword monitor eDP-1,preferred,auto,1
# bindl=,switch:off:Lid Switch,exec,hyprctl keyword monitor eDP-1,disable

bind = SHIFT,Escape,submap,bypass
submap = bypass
bind = SHIFT,Escape,submap,reset
submap = reset

bind = $mainMod,R,submap,resize
submap = resize
binde = ,right,resizeactive,10 0
binde = ,left,resizeactive,-10 0
binde = ,up,resizeactive,0 -10
binde = ,down,resizeactive,0 10
bind = ,escape,submap,reset 
submap = reset

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Move between previous/next workspace with mouse PREV/NEXT
bind = $mainMod, mouse:275, workspace, m+1
bind = $mainMod, mouse:276, workspace, m-1

# open hyprswitch
# bind = $mainMod, grave, hyprexpo:expo, toggle
bind = $mainMod, grave, exec, ~/.local/bin/overlaytui.sh ~/.config/hypr/scripts/switchwindow.sh
# bind = , mouse:277, exec, alacritty --class=overlay-term --option font.size=24 -e /usr/bin/bash -c ~/.config/hypr/scripts/switchwindow.sh
bind = $mainMod SHIFT, space, exec, ~/.config/hypr/scripts/selectwallpaper.sh

# launch programs
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = hyprpaper
exec-once = swww-daemon
# exec-once = hyprctl plugin load ~/.config/hypr/plugins/hyprbars.so
# exec-once = hyprctl plugin load ~/.config/hypr/plugins/hyprexpo.so
exec-once = dunst
exec-once = waybar > ~/.cache/waybar.log 2>&1
exec-once = swayosd-server
exec-once = owncloud
# exec-once = nm-applet
# exec-once = blueman-applet
# exec-once = ~/.config/hypr/scripts/sleep.sh $wallpaper_image
# exec-once = agsv1
exec-once = kanshi
exec-once = hypridle
exec-once = wl-paste -p -w 'wl-copy'
